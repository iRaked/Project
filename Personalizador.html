                <span id="nickPreview" class="nick-preview">Tu nick aquí</span>
              </div>

              <label class="input-label">Código para Xat</label>
              <div class="output-box">
                <code id="bbcodeOutput">[font=Arial]Tu nick aquí[/font]</code>
                <button id="btnCopy" class="btn-copy" title="Copiar">
                  <i class="fa-regular fa-copy"></i>
                </button>
              </div>
            </div>

            <!-- COLUMNA DERECHA -->
            <div class="nicks-col-right">
              <label class="input-label">Fuentes</label>

              </div>

              </div>

                  <input type="color" class="color-square" value="#ff0000" />
                </div>

                </div>

      <!-- AVATAR -->

        <div class="avatars-layout">

          <div class="avatars-col-left">
            
            <label class="input-label">Subir Imagen</label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="avatarUpload" accept="image/*" hidden />
              <button class="btn-upload" id="btnUpload">
                <i class="fa-solid fa-cloud-arrow-up"></i> Seleccionar imagen
              </button>
            </div>

            <label class="input-label">Filtros y Ajustes</label>
            <div class="avatar-filters">
              <div class="filter-row">
                <span>Brillo</span>
                <input type="range" id="filterBrightness" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Contraste</span>
                <input type="range" id="filterContrast" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Saturación</span>
                <input type="range" id="filterSaturate" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Escala de grises</span>
                <input type="range" id="filterGrayscale" min="0" max="100" value="0" class="speed-slider">
              </div>
            </div>

            <label class="input-label">Forma / Marco</label>
            <div class="shape-grid" id="shapeGrid">
              <button class="shape-btn active" data-shape="square">Cuadrado</button>
              <button class="shape-btn" data-shape="circle">Círculo</button>
              <button class="shape-btn" data-shape="heart">Corazón</button>
              <button class="shape-btn" data-shape="flower">Flor</button>
            </div>

            <label class="input-label">Posición y Tamaño</label>
            <div class="avatar-position">
              <div class="filter-row">
                <span>Eje X</span>
                <input type="range" id="posX" min="-500" max="500" value="0" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Eje Y</span>
                <input type="range" id="posY" min="-500" max="500" value="0" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Zoom</span>
                <input type="range" id="imgZoom" min="10" max="200" value="100" class="speed-slider">
              </div>
            </div>

          </div>

          <!-- COLUMNA DERECHA: Vista Previa y Salida -->

            <!-- 1. PERFIL (Nick unificado) - PRIMERO Y MINIMALISTA -->
