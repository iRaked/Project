  <!-- BLOCK -->
  <script type="text/javascript">
    (function () {
      'use strict';

      function isEditable(el) {
        if (!el) return false;
        if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
        if (el.tagName === 'INPUT') {
          const t = (el.type || 'text').toLowerCase();
          return !['button', 'submit', 'reset', 'checkbox', 'radio', 'file'].includes(t);
        }
        return !!el.isContentEditable;
      }

      function editable(e) {
        const path = e.composedPath ? e.composedPath() : [e.target];
        return path.some(isEditable);
      }

      document.addEventListener('keydown', function (e) {
        const key = (e.key || '').toUpperCase();
        const ctrl = e.ctrlKey || e.metaKey;

        if (key === 'F12' ||
            (ctrl && e.shiftKey && ['I','J','C','K','E','M'].includes(key)) ||
            (ctrl && ['U','S','P'].includes(key))) {
          e.preventDefault();
          return false;
        }

        if (editable(e)) return true;

        if (['CONTROL','SHIFT','ALT','META','CAPSLOCK','TAB'].includes(key)) return true;

        e.preventDefault();
        return false;
      }, true);

      document.addEventListener('contextmenu', function (e) {
        if (editable(e)) return true;
        e.preventDefault();
        return false;
      }, true);

      document.addEventListener('dragstart', function (e) {
        const tag = e.target && e.target.tagName;
        if (tag === 'IMG' || tag === 'A') e.preventDefault();
      }, true);
    })();
  </script>

<button class="solid-color-btn" data-effect="namecolor" data-glow="#B57026" data-colors="#B57026,#F5C3C7" title="Marrón Rosa" style="background: #F5C3C7; box-shadow: 0 0 4px #B57026;"></button>
<!-- Fuego -->
<button class="color-preset" data-effect="namecolor" data-glow="#FF0000" data-colors="#FF0000,#FFFF00" title="Fuego" style="background: #FFFF00; box-shadow: 0 0 8px #FF0000;"></button>
<!-- Duo Magenta + Aqua -->
<button class="color-preset" data-effect="namecolor" data-glow="#FF00FF" data-colors="#FF00FF,#00FFFF" title="Duo Magenta + Aqua" style="background: #00FFFF; box-shadow: 0 0 8px #FF00FF;">
</button>
<!-- Duo 2 Aqua + Amarillo -->
<button class="color-preset" data-effect="namecolor" data-glow="#00FFFF" data-colors="#00FFFF,#FFFF00" title="Duo 2 Aqua + Amarillo" style="background: #FFFF00; box-shadow: 0 0 8px #00FFFF;"></button>

                </div>
            </div>

              <label class="input-label">
                Degradados guardados
                <button class="save-gradient-btn" id="saveGradientBtn" title="Guardar degradado actual">
                  <i class="fa-solid fa-floppy-disk"></i>
                </button>
              </label>
              <div class="saved-gradients" id="savedGradients">
                <p class="no-saved">Sin degradados guardados</p>
              </div>
            </div>

          </div>
        </section>
      <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
      <!-- AVATAR -->
      <section id="avatares" class="tab-pane">
        <div class="avatars-layout">

          <!-- COLUMNA IZQUIERDA: Controles -->
          <div class="avatars-col-left">
            
            <label class="input-label">Subir Imagen</label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="avatarUpload" accept="image/*" hidden />
              <button class="btn-upload" id="btnUpload">
                <i class="fa-solid fa-cloud-arrow-up"></i> Seleccionar imagen
              </button>
            </div>

            <label class="input-label">Filtros y Ajustes</label>
            <div class="avatar-filters">
              <div class="filter-row">
                <span>Brillo</span>
                <input type="range" id="filterBrightness" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Contraste</span>
                <input type="range" id="filterContrast" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Saturación</span>
                <input type="range" id="filterSaturate" min="0" max="200" value="100" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Escala de grises</span>
                <input type="range" id="filterGrayscale" min="0" max="100" value="0" class="speed-slider">
              </div>
            </div>

            <label class="input-label">Forma / Marco</label>
            <div class="shape-grid" id="shapeGrid">
              <button class="shape-btn active" data-shape="square">Cuadrado</button>
              <button class="shape-btn" data-shape="circle">Círculo</button>
              <button class="shape-btn" data-shape="heart">Corazón</button>
              <button class="shape-btn" data-shape="flower">Flor</button>
            </div>

            <label class="input-label">Posición y Tamaño</label>
            <div class="avatar-position">
              <div class="filter-row">
                <span>Eje X</span>
                <input type="range" id="posX" min="-500" max="500" value="0" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Eje Y</span>
                <input type="range" id="posY" min="-500" max="500" value="0" class="speed-slider">
              </div>
              <div class="filter-row">
                <span>Zoom</span>
                <input type="range" id="imgZoom" min="10" max="200" value="100" class="speed-slider">
              </div>
            </div>

          </div>

          <!-- COLUMNA DERECHA: Vista Previa y Salida -->
          <div class="avatars-col-right">
            
            <!-- 1. PERFIL (Nick unificado) - PRIMERO Y MINIMALISTA -->
            <div class="unified-nick-minimal" id="unifiedPreviewBox">
              <span class="unified-nick-display">Tu nick</span>
            </div>

            <!-- 2. CANVAS (Sin label, solo el marco) -->
            <div class="canvas-container">
              <canvas id="avatarCanvas" width="512" height="512"></canvas>
            </div>

            <!-- 3. BOTONES (Compactos, con scroll si es necesario) -->
            <div class="avatar-actions-scroll">
              <button class="btn-action" id="btnDownloadAvatar">
                <i class="fa-solid fa-download"></i> Descargar PNG
              </button>
              <a href="https://xatimg.com" target="_blank" class="btn-action btn-xat">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Subir a Xat
              </a>
            </div>

          </div>
        </div>
      </section>
      
    </main>
  </div>

</body>
</html>
